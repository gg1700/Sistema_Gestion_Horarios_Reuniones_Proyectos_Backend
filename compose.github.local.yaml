name: orbitia-local
services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: Telematicos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Telematicos"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:

name: telematics-t07

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: servicios_telematicos
      POSTGRES_USER: telematics
      POSTGRES_PASSWORD: telematics_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telematics -d servicios_telematicos"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
